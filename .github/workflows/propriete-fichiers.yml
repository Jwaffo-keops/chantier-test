name: propriete-fichiers

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: propriete-fichiers-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      # Aucun checkout : le code de la PR n'est jamais récupéré ni exécuté.
      - uses: actions/github-script@v7
        with:
          script: |
            // Miroir de .github/CODEOWNERS — la DERNIÈRE règle qui correspond l'emporte.
            const REGLES = [
              { motif: '*',                 proprietaire: 'jwaffo-keops' },
              { motif: '/lots/peinture.md', proprietaire: 'juliusnova623' },
            ];
            const CONTEXTE = 'propriete-fichiers';

            const correspond = (motif, chemin) => {
              if (motif === '*') return true;
              const m = motif.replace(/^\//, '');
              if (m.endsWith('/')) return chemin.startsWith(m);
              return chemin === m;
            };
            const proprietaireDe = (chemin) => {
              let p = null;
              for (const r of REGLES) if (correspond(r.motif, chemin)) p = r.proprietaire;
              return p ? p.toLowerCase() : null;
            };

            const { owner, repo } = context.repo;
            const numero = context.payload.pull_request.number;

            // Toujours relire la PR : head.sha doit être le commit de tête ACTUEL.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: numero });
            const headSha = pr.head.sha;
            const auteur = pr.user.login.toLowerCase();

            // Fichiers modifiés (paginés), y compris l'ancien nom en cas de renommage.
            const fichiers = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: numero, per_page: 100,
            });
            const chemins = new Set();
            for (const f of fichiers) {
              chemins.add(f.filename);
              if (f.previous_filename) chemins.add(f.previous_filename);
            }

            const requis = new Set();
            for (const c of chemins) {
              const p = proprietaireDe(c);
              if (p && p !== auteur) requis.add(p);
            }

            // Dernier avis non « COMMENTED » de chaque personne (ordre chronologique).
            const avis = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: numero, per_page: 100,
            });
            const dernier = new Map();
            for (const a of avis) {
              if (!a.user || a.state === 'COMMENTED') continue;
              dernier.set(a.user.login.toLowerCase(), a);
            }
            const approuve = (login) => {
              const a = dernier.get(login);
              return !!a && a.state === 'APPROVED' && a.commit_id === headSha;
            };

            const manquants = [...requis].filter((p) => !approuve(p)).sort();
            const ok = manquants.length === 0;
            const description = ok
              ? (requis.size ? 'Approbations des propriétaires obtenues' : 'Aucun fichier d\'un autre propriétaire')
              : ('Approbation requise : ' + manquants.map((p) => '@' + p).join(', '));

            core.info(`Auteur : ${auteur} | fichiers : ${[...chemins].join(', ')}`);
            core.info(`Requis : ${[...requis].join(', ') || '(aucun)'} | ${description}`);

            await github.rest.repos.createCommitStatus({
              owner, repo, sha: headSha,
              state: ok ? 'success' : 'failure',
              context: CONTEXTE,
              description: description.slice(0, 140),
            });
